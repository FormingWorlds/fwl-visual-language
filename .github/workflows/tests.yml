name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[test]" "ruff==0.17.1"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Generated files match the tokens
        run: python -m fwl_visual_language check
      - name: Test with coverage
        run: pytest -q --cov --cov-report=term-missing --cov-fail-under=90

  wheel:
    name: Test the installed wheel outside the source tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build the wheel
        run: |
          pip install build
          python -m build --wheel .
      - name: Install the wheel with the oldest supported test dependencies
        run: pip install "matplotlib==3.7.*" "cmcrameri==1.7.*" "numpy<2" "python-pptx==1.0.*" "python-docx==1.1.*" "fonttools>=4" colorspacious pytest dist/*.whl
      - name: Run the tests against the installed package
        run: |
          mkdir ../wheeltest
          cp -R tests themes templates ../wheeltest/
          cd ../wheeltest
          python -c "import fwl_visual_language as f, sys; assert 'site-packages' in f.__file__, f.__file__"
          pytest -q tests

  latex:
    name: Compile documents and a talk with the LaTeX packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TeX and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-luatex texlive-latex-recommended \
            texlive-latex-extra texlive-bibtex-extra texlive-science texlive-publishers poppler-utils
      - name: Install
        run: |
          pip install -e ".[test]"
          pip install --no-deps "fwl-mpl @ git+https://github.com/FormingWorlds/fwl-mpl@b147dd1736734ec069c1c08e7b093419f95d0fb9"
      - name: Compile and check the embedded fonts (fails if a test is skipped)
        run: |
          set -o pipefail
          pytest -rs tests/test_build_latex.py::test_document_compiles_and_embeds_only_geist \
            tests/test_build_latex.py::test_proposal_compiles_with_inter_and_stix_math \
            tests/test_build_latex.py::test_math_loads_once_and_only_in_the_preamble \
            tests/test_build_latex.py::test_bm_and_boldsymbol_give_bold_math_with_or_without_the_bm_package \
            tests/test_build_latex.py::test_greek_and_bold_math_in_headings_reach_the_bookmarks \
            tests/test_poster.py::test_each_format_compiles_to_its_page_size_with_every_text \
            tests/test_poster.py::test_a_poster_needs_exactly_3_messages \
            tests/test_poster.py::test_the_ground_header_and_rule_have_the_look_colours \
            tests/test_poster.py::test_text_that_does_not_fit_stops_the_run \
            tests/test_poster.py::test_a_longer_statement_pushes_its_figures_down_without_overlap \
            tests/test_beamer.py::test_talk_compiles_with_references_in_both_corners \
            tests/test_beamer.py::test_talk_embeds_the_lab_fonts \
            tests/test_thesis.py::test_the_example_compiles_with_each_section_on_its_own_page \
            tests/test_thesis.py::test_the_final_option_hides_every_guide \
            tests/test_thesis.py::test_citations_are_author_year_and_the_fonts_are_the_lab_fonts \
            tests/test_thesis.py::test_the_running_head_and_the_contents \
            tests/test_thesis.py::test_guides_are_grey_and_section_numbers_signal_blue \
            tests/test_thesis.py::test_the_script_replots_the_committed_figure_from_the_data \
            tests/test_thesis.py::test_a_long_title_without_a_short_form_gets_a_warning \
            tests/test_stationery.py::test_each_letterhead_has_2_a4_pages_with_the_sender_and_footers \
            tests/test_stationery.py::test_the_letterheads_embed_only_geist_and_draw_the_rule_in_signal_blue \
            tests/test_stationery.py::test_the_same_sender_gives_the_same_bytes_and_the_committed_files_match \
            tests/test_stationery.py::test_tex_characters_in_the_sender_compile_and_print_as_typed \
            tests/test_stationery.py::test_a_sender_wider_than_its_room_stops_the_build \
            tests/test_stationery.py::test_a_character_without_a_glyph_in_geist_stops_the_build \
            tests/test_stationery.py::test_the_room_ends_within_1_word_of_the_longest_sender_that_fits | tee out.txt
          grep -qE "(^|[^0-9])42 passed" out.txt
          if grep -qE "[0-9]+ (skipped|failed|errors?)" out.txt; then exit 1; fi
